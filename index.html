            a: `Основания регламентированы п. 4 ч. 1 ст. 9 ФЗ от 03.07.2016 N 226-ФЗ «О войсках национальной гвардии РФ». Сотрудники вправе проверять документы, если имеются данные:
- дающие основания подозревать в совершении преступления или полагать, что они в розыске;
- если имеется повод к возбуждению дела об административном правонарушении;
- если имеются основания для задержания в случаях, предусмотренных ФЗ.

Порядок (Ст. 4.1 ФЗ 226): Сотрудник обязан назвать должность, звание, фамилию, предъявить служебное удостоверение, сообщить причину и цель обращения. При применении мер, ограничивающих права, разъяснить причину, основания, права и обязанности. (Вправе не исполнять при угрозе жизни или необходимости пресечения преступления).`

        {

- Негласный (тайно от окружающих).

1) лицо застигнуто при совершении или непосредственно после;

    let idx = 0;
    let isVisible = false;

    const qEl = document.getElementById('question');
    const aEl = document.getElementById('answer');
    const btnShow = document.getElementById('btnShow');
    const counterEl = document.getElementById('counter');
    const progressEl = document.getElementById('progress');

    function render() {
        qEl.textContent = questions[idx].q;
        aEl.textContent = questions[idx].a;
        isVisible = false;
        aEl.style.display = 'none';
        btnShow.textContent = 'Показать ответ';
        btnShow.style.backgroundColor = '#f1c40f';
        
        counterEl.textContent = `Вопрос ${idx + 1} из ${questions.length}`;
        progressEl.style.width = ((idx + 1) / questions.length) * 100 + '%';
    }

    function toggleA() {
        isVisible = !isVisible;
        if (isVisible) {
            aEl.style.display = 'block';
            btnShow.textContent = 'Скрыть ответ';
            btnShow.style.backgroundColor = '#e67e22';
        } else {
            aEl.style.display = 'none';
            btnShow.textContent = 'Показать ответ';
            btnShow.style.backgroundColor = '#f1c40f';
        }
    }

    function nextQ() {
        if (idx < questions.length - 1) {
            idx++;
            render();
        } else {
            alert("Вы прошли все вопросы! Начните заново для закрепления.");
            idx = 0;
            render();
        }
    }

    function prevQ() {
        if (idx > 0) {
            idx--;
            render();
        }
    }

    function speak() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const text = questions[idx].q + ". " + questions[idx].a;
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'ru-RU';
            utter.rate = 0.9;
            window.speechSynthesis.speak(utter);
        } else {
            alert("Браузер не поддерживает озвучку.");
        }
    }

    render();
</script>
